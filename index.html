  }
  const shots=[];
  for (const g of all.slice().sort((a,b)=>b.updated-a.updated)) for (let i=g.shots.length-1;i>=0;i--) shots.push({g,i});
  if (shots.length) rows.append(row('Neueste Screenshots', shots.slice(0,14).map(shotCard)));
  rows.append(row('Neu in deiner Sammlung', all.slice().sort((a,b)=>(b.created||0)-(a.created||0)).slice(0,14).map(posterCard), {more:()=>{ S.sort='added'; $('#f-sort').value='added'; setView('lib',true); }}));
  for (const [gname] of countBy(all,g=>g.genres).filter(x=>x[1]>=2).slice(0,3))
    rows.append(row(gname, all.filter(g=>g.genres.includes(gname)).sort((a,b)=>(b.score||0)-(a.score||0)).map(posterCard)));
  const now=new Date(); const ym=`${now.getFullYear()-1}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const mem=all.filter(g=>(g.end||g.start||'').startsWith(ym));
  if (mem.length) rows.append(row('Heute vor einem Jahr', mem.map(posterCard)));
  root.append(rows);
}

/* ---------- Statistik ---------- */
function hbars(rows){
  const max=Math.max(1,...rows.map(r=>r[1]));
  return h('div',{class:'hbars'}, rows.map(([l,v,disp])=>h('div',{class:'hbar'}, h('span',{class:'hbar-l', title:l}, l), h('span',{class:'hbar-t'}, h('span',{class:'hbar-f', style:{width:(v/max*100)+'%'}})), h('span',{class:'hbar-v'}, disp ?? String(v)))));
}
function countBy(list, keyFn){ const m=new Map(); for (const g of list) for (const k of keyFn(g)) if (k) m.set(k,(m.get(k)||0)+1); return [...m.entries()].sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0],'de')); }
function yearChart(all){
  const years=[...new Set(all.map(g=>g.year))].sort((a,b)=>a-b);
  const data=years.map(y=>{ const gs=all.filter(g=>g.year===y); return {y, n:gs.length, hrs:sum(gs,g=>g.hours)}; });
  const max=Math.max(1,...data.map(d=>d.n));
  const bw=46, gap=30, top=26, bottom=44, H=220, plotH=H-top-bottom;
  const content=data.length*bw+(data.length-1)*gap; const W=Math.max(340, content+24); const x0=(W-content)/2;
  const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`, width:W, height:H, role:'img', 'aria-label':'Spiele pro Jahr'});
  svg.append(sv('line',{x1:8, x2:W-8, y1:top+plotH+.5, y2:top+plotH+.5, class:'c-axis'}));
  data.forEach((d,i)=>{
    const x=x0+i*(bw+gap), bh=Math.max(2, d.n/max*plotH), yy=top+plotH-bh;
    const r=sv('rect',{x, y:yy, width:bw, height:bh, rx:4, class:d.y===YEAR_NOW?'c-bar':'c-bar-past'}); r.append(sv('title',{}, `${d.y}: ${plural(d.n,'Spiel','Spiele')}${d.hrs?', '+nf1.format(d.hrs)+' h':''}`));
    svg.append(r, sv('text',{x:x+bw/2, y:yy-8, 'text-anchor':'middle', class:'c-val'}, String(d.n)),
      sv('text',{x:x+bw/2, y:top+plotH+18, 'text-anchor':'middle', class:'c-lbl'}, String(d.y)),
      sv('text',{x:x+bw/2, y:top+plotH+34, 'text-anchor':'middle', class:'c-sub'}, d.hrs ? nf1.format(d.hrs)+' h' : '–'));
  });
  return h('div',{class:'chart-scroll'}, svg);
}
function scoreHist(scored){
  const bins=Array.from({length:10},()=>0);
  for (const g of scored) bins[Math.min(9, Math.max(0, Math.floor(g.score)-1))]++;
  const max=Math.max(1,...bins); const W=340, H=150, top=20, bottom=24, plotH=H-top-bottom, bw=24, step=W/10;
  const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`, width:'100%', role:'img', 'aria-label':'Verteilung der Wertungen', style:'max-width:440px'});
  svg.append(sv('line',{x1:0, x2:W, y1:top+plotH+.5, y2:top+plotH+.5, class:'c-axis'}));
  bins.forEach((n,i)=>{
    const cx=step*i+step/2, bh=n ? Math.max(3, n/max*plotH) : 0, yy=top+plotH-bh;
    if (n) svg.append(sv('rect',{x:cx-bw/2, y:yy, width:bw, height:bh, rx:3, class:'c-bar'}), sv('text',{x:cx, y:yy-6, 'text-anchor':'middle', class:'c-val'}, String(n)));
    svg.append(sv('text',{x:cx, y:H-6, 'text-anchor':'middle', class:'c-lbl'}, String(i+1)));
  });
  return svg;
}
function rankList(list, valFn){
  return h('ol',{class:'rank-list'}, list.map((g,i)=>h('li',null, h('button',{type:'button', onclick:()=>openDetail(g.id)}, h('span',{class:'r-n'}, String(i+1)), h('span',{class:'r-t'}, g.title), h('span',{class:'r-v'}, valFn(g))))));
}
function renderStats(){
  const root=$('#view-stats'); root.replaceChildren();
  const gate=gateEl(); if (gate){ root.append(gate); return; }
  root.append(h('div',{class:'page-head'}, h('h2',{class:'page-title'},'Statistik')));
  const all=[...S.games.values()];
  if (!all.length){ root.append(h('div',{class:'notice'}, h('h2',null,'Noch keine Statistik'), h('p',{class:'muted'},'Sobald du Spiele einträgst, siehst du hier Spielzeit, Wertungen, Lieblingsgenres und deine Jahre im Vergleich.'))); if (S.owner) root.append(toolsPanel()); return; }
  const scored=all.filter(g=>g.score); const hrs=sum(all,g=>g.hours);
  const done=all.filter(g=>g.status==='durch'||g.status==='platin').length;
  const avg=scored.length ? sum(scored,g=>g.score)/scored.length : null;
  const thisYear=gamesOf(YEAR_NOW);
  root.append(h('div',{class:'kpis'},
    h('div',{class:'kpi'}, h('span',{class:'lbl'},'Spiele'), h('span',{class:'kpi-v'}, String(all.length)), h('span',{class:'kpi-s'}, `${thisYear.length} davon ${YEAR_NOW}`)),
    h('div',{class:'kpi'}, h('span',{class:'lbl'},'Spielzeit'), h('span',{class:'kpi-v'}, nf1.format(Math.round(hrs)), h('small',null,'h')), h('span',{class:'kpi-s'}, `${nf1.format(sum(thisYear,g=>g.hours))} h in ${YEAR_NOW}`)),
    h('div',{class:'kpi'}, h('span',{class:'lbl'},'Ø Wertung'), h('span',{class:'kpi-v'}, avg ? nf1.format(Math.round(avg*10)/10) : '–', avg ? h('small',null,'/10') : null), h('span',{class:'kpi-s'}, `aus ${plural(scored.length,'Wertung','Wertungen')}`)),
    h('div',{class:'kpi'}, h('span',{class:'lbl'},'Durchgespielt'), h('span',{class:'kpi-v'}, String(done)), h('span',{class:'kpi-s'}, `${Math.round(done/all.length*100)} % aller Spiele`))));

  const withYear=all.filter(g=>g.year), noYear=all.length-withYear.length;
  const genres=countBy(all,g=>g.genres).slice(0,8);
  const plats=countBy(all,g=>[g.platform]).slice(0,8);
  const best=scored.slice().sort((a,b)=>b.score-a.score || a.title.localeCompare(b.title,'de')).slice(0,5);
  const longest=all.filter(g=>g.hours).sort((a,b)=>b.hours-a.hours).slice(0,5);
  const now=new Date(); const ym=`${now.getFullYear()-1}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const memory=all.filter(g=>(g.end||'').startsWith(ym) || (!g.end && (g.start||'').startsWith(ym)));

  root.append(h('div',{class:'panels'},
    memory.length ? h('section',{class:'panel wide'}, h('h3',null,'Vor einem Jahr'), h('div',{class:'memory'}, memory.map(g=>h('p',null, `Im ${MONTHS[now.getMonth()]} ${now.getFullYear()-1} hast du `, h('strong',null,g.title), g.end ? ' beendet' : ' angefangen', g.score ? ` und mit ${fmtScore(g.score)} bewertet.` : '.')))) : null,
    h('section',{class:'panel wide'}, h('h3',null,'Spiele pro Jahr'),
      withYear.length ? yearChart(withYear) : h('p',{class:'muted'},'Noch keinem Spiel ist ein Jahr zugeordnet.'),
      noYear ? h('p',{class:'small muted'}, `${plural(noYear,'Spiel','Spiele')} ohne Jahr ${noYear===1?'ist':'sind'} hier nicht mitgezählt.`) : null),
    h('section',{class:'panel'}, h('h3',null,'Wertungen'), scored.length ? scoreHist(scored) : h('p',{class:'muted'},'Noch keine Wertungen.')),
    h('section',{class:'panel'}, h('h3',null,'Genres'), genres.length ? hbars(genres) : h('p',{class:'muted'},'Noch keine Genres eingetragen.')),
    h('section',{class:'panel'}, h('h3',null,'Plattformen'), plats.length ? hbars(plats) : h('p',{class:'muted'},'Noch keine Plattformen eingetragen.')),
    h('section',{class:'panel'}, h('h3',null,'Bestbewertet'), best.length ? rankList(best,g=>fmtScore(g.score)) : h('p',{class:'muted'},'Noch keine Wertungen.')),
    h('section',{class:'panel'}, h('h3',null,'Längste Abenteuer'), longest.length ? rankList(longest,g=>fmtHours(g.hours)) : h('p',{class:'muted'},'Noch keine Spielzeiten eingetragen.')),
    S.owner ? toolsPanel() : null));
}
function toolsPanel(){
  const meter=h('div',{class:'memory'});
  const status=h('p',{class:'pub-status', id:'pub-status', 'aria-live':'polite'});
  const zipBtn=h('button',{class:'btn btn-red btn-sm', type:'button'}, icon('down'), 'Paket herunterladen (ZIP)');
  zipBtn.addEventListener('click', ()=>exportZip(zipBtn, t=>{ status.textContent=t; }));
  const p=h('section',{class:'panel'}, h('h3',null,'Veröffentlichen & Backup'),
    h('p',{class:'small muted'},'Das Paket enthält die Seite, alle Einträge und alle Bilder. Es ist dein komplettes Backup, und hochgeladen bei GitHub Pages kann jeder die Seite ohne Claude ansehen.'),
    h('ol',{class:'pub-steps'},
      h('li',null,'Paket herunterladen und entpacken.'),
      h('li',null,'Inhalt in dein GitHub-Repo legen, am einfachsten mit GitHub Desktop.'),
      h('li',null,'Nach neuen Einträgen wiederholen. Git speichert jede alte Version.')),
    S.downloads ? h('div',{class:'pub-btns'}, zipBtn, h('button',{class:'btn btn-sm', type:'button', onclick:exportJson}, 'Nur Daten (JSON)')) : h('p',{class:'small muted'},'Downloads sind in dieser Ansicht nicht verfügbar.'),
    status,
    meter);
  if (S.assets){
    const draw=u=>{ const pct=u.maxBytes ? Math.min(100, u.bytes/u.maxBytes*100) : 0; meter.replaceChildren(h('p',{class:'small'}, `Bilder: ${plural(u.files,'Datei','Dateien')}, ${fmtBytes(u.bytes)}${u.maxBytes ? ' von '+fmtBytes(u.maxBytes) : ''}`), u.maxBytes ? h('div',{class:'meter'}, h('span',{style:{width:pct+'%'}})) : null); };
    if (S.usage && Date.now()-S.usage.t<60000) draw(S.usage.u);
    else S.assets.list().then(r=>{ S.usage={t:Date.now(), u:r.usage}; draw(r.usage); }).catch(()=>{});
  }
  return p;
}
const README=`SPEICHERSTAND – dein Spieletagebuch

Inhalt
  index.html          die Seite
  daten/spiele.json   alle Einträge und Tierlisten als JSON
  daten/spiele.js     dieselben Daten, so verpackt, dass die Seite sie lädt
  bilder/             Cover und Screenshots
  schriften/          die Schriften der Seite (Bebas Neue, Instrument Sans; SIL Open Font License)

Ansehen
  index.html im Browser öffnen. Das klappt auch offline.

Öffentlich machen mit GitHub Pages
  1. Öffentliches Repo anlegen, z. B. "speicherstand".
  2. Diesen Ordnerinhalt hochladen (GitHub Desktop oder im Browser
     über "Add file > Upload files", dort höchstens 100 Dateien pro Upload).
  3. Settings > Pages: Branch "main" und Ordner "/ (root)" wählen, speichern.
  4. Nach kurzer Zeit ist die Seite unter https://DEINNAME.github.io/speicherstand/ erreichbar.

Aktualisieren
  Neues Paket herunterladen, Inhalt über den alten Ordner kopieren, hochladen.
`;
const FONT_FILES=['schriften/bebas-neue-400.woff2','schriften/instrument-sans-400.woff2','schriften/instrument-sans-500.woff2','schriften/instrument-sans-600.woff2','schriften/instrument-sans-700.woff2'];
function loadJSZip(){
  if (window.JSZip) return Promise.resolve(window.JSZip);
  return new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; sc.onload=()=>window.JSZip ? res(window.JSZip) : rej(new Error('jszip')); sc.onerror=()=>rej(new Error('jszip')); document.head.append(sc); });
}
function exportData(map){
  return { app:'Speicherstand', version:2, exportiert:new Date().toISOString(),
    spiele:[...S.games.values()].map(g=>({...g, shots:g.shots.map(s=>({id:s.id, caption:s.caption}))})),
    tierlisten:S.tiers, bilder:map||{} };
}
let exporting=false;
async function exportZip(btn, status){
  if (exporting) return;
  if (!S.downloads){ toast('Downloads sind in dieser Ansicht nicht verfügbar.'); return; }
  exporting=true; btn.disabled=true;
  try {
    status('Lade das Packprogramm …');
    const JSZip=await loadJSZip();
    const zip=new JSZip();
    const ids=[...new Set([...S.games.values()].flatMap(g=>[g.cover, ...g.shots.map(s=>s.id)]).filter(Boolean))];
    const map={}; let failed=0;
    for (let i=0;i<ids.length;i++){
      const id=ids[i];
      status(`Packe Bild ${i+1} von ${ids.length} …`);
      try {
        const r=await fetch(blobUrl(id)); if (!r.ok) throw new Error(String(r.status));
        const b=await r.blob();
        const ext=({'image/png':'png','image/webp':'webp','image/gif':'gif'})[b.type] || 'jpg';
        const path=`bilder/${id}.${ext}`;
        zip.file(path, b, {binary:true, compression:'STORE'}); map[id]=path;
      } catch { failed++; }
    }
    const data=exportData(map);
    zip.file('daten/spiele.json', JSON.stringify(data,null,2));
    zip.file('daten/spiele.js', 'window.SPEICHERSTAND_DATEN = '+JSON.stringify(data)+';\n');
    zip.file('LIESMICH.txt', README);
    status('Füge die Seite hinzu …');
    let pageOk=false;
    try { const r=await fetch('export/index.html', {cache:'no-store'}); if (r.ok){ zip.file('index.html', await r.text()); pageOk=true; } } catch {}
    for (const f of FONT_FILES){ try { const r=await fetch('export/'+f); if (r.ok) zip.file(f, await r.blob(), {binary:true, compression:'STORE'}); } catch {} }
    status('Erstelle die ZIP-Datei …');
    const blob=await zip.generateAsync({type:'blob', compression:'DEFLATE', compressionOptions:{level:6}});
    const d=new Date(); const stamp=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    status('Warte auf deine Bestätigung zum Speichern …');
    await S.downloads.save({filename:`speicherstand-${stamp}.zip`, data:blob});
    const notes=[failed ? `${plural(failed,'Bild','Bilder')} konnten nicht geladen werden.` : '', pageOk ? '' : 'Die Seite selbst fehlt im Paket, frag Claude nach einer neuen index.html.'].filter(Boolean).join(' ');
    status(`Gespeichert: ${plural(Object.keys(map).length,'Bild','Bilder')}, ${plural(S.games.size,'Spiel','Spiele')}. ${notes}`.trim());
  } catch (e){
    const code=e && e.code;
    status(code==='declined' ? 'Speichern abgebrochen.' : code==='extension_not_enabled' || code==='rejected_extension' ? 'ZIP-Dateien sind hier gerade nicht erlaubt. Nimm „Nur Daten (JSON)“.' : 'Das Paket konnte nicht erstellt werden. Prüfe deine Verbindung und versuch es nochmal.');
  } finally { exporting=false; btn.disabled=false; }
}
async function exportJson(){
  const data={ app:'Speicherstand', version:1, exportedAt:new Date().toISOString(),
    games:[...S.games.values()].map(g=>({...g, shots:g.shots.map(s=>({id:s.id, caption:s.caption}))})), tierlists:S.tiers };
  const d=new Date(); const stamp=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  try { await S.downloads.save({filename:`speicherstand-backup-${stamp}.json`, data:JSON.stringify(data,null,2)}); toast('Backup gespeichert'); }
  catch (e){ if (!e || e.code!=='declined') toast('Download geht in dieser Ansicht gerade nicht.'); }
}

/* ---------- Start ---------- */
function bind(){
  $('#dl-platforms').replaceChildren(...PLATFORMS.map(p=>h('option',{value:p})));
  for (const t of document.querySelectorAll('.tab')) t.addEventListener('click', ()=>setView(t.dataset.view, true));
  $('#brand').addEventListener('click', e=>{ e.preventDefault(); setView('start', true); });
  $('#btn-new').addEventListener('click', ()=>openEditor(null));
  $('#q').addEventListener('input', e=>{ S.q=e.target.value; renderLib(); });
  $('#f-sort').addEventListener('change', e=>{ S.sort=e.target.value; renderLib(); });
  $('#f-status').addEventListener('change', e=>{ S.fStatus=e.target.value; renderLib(); });
  window.addEventListener('scroll', updTop, {passive:true});
  document.addEventListener('visibilitychange', ()=>document.body.classList.toggle('tab-hidden', document.hidden));
  $('#detail').addEventListener('click', e=>{ if (e.target===e.currentTarget) closeDetail(); });
  document.addEventListener('keydown', e=>{
    if (!$('#lightbox').hidden){ if (e.key==='Escape') closeLB(); else if (e.key==='ArrowLeft') stepLB(-1); else if (e.key==='ArrowRight') stepLB(1); return; }
    if (e.key==='Escape' && !$('#detail').hidden && $('#editor').hidden) closeDetail();
  });
  document.addEventListener('paste', e=>{
    if (!E || !S.assets) return;
    const files=[...(e.clipboardData?.files||[])].filter(f=>/^image\//.test(f.type));
    if (!files.length) return;
    e.preventDefault(); addShots(files); toast(plural(files.length,'Screenshot','Screenshots')+' eingefügt');
  });
  const tok=(location.hash||'').slice(1);
  setView(tok==='bibliothek'?'lib':tok==='tierlisten'?'tiers':tok==='statistik'?'stats':'start', false);
}
function loadStatic(){
  return new Promise(res=>{
    if (window.SPEICHERSTAND_DATEN) return res(window.SPEICHERSTAND_DATEN);
    const sc=document.createElement('script'); sc.src='daten/spiele.js';
    sc.onload=()=>res(window.SPEICHERSTAND_DATEN || null); sc.onerror=()=>res(null);
    document.head.append(sc);
  });
}
async function startStatic(){
  const data=await loadStatic();
  if (!data || !Array.isArray(data.spiele)){ S.noDb=true; renderAll(); return; }
  const map={};
  for (const [id,path] of Object.entries(data.bilder||{})) if (isId(id) && /^bilder\/[A-Za-z0-9_-]+\.(jpg|png|webp|gif)$/.test(path)) map[id]=path;
  S.assetMap=map; S.isStatic=true; S.owner=false; S.exportedAt=typeof data.exportiert==='string' ? data.exportiert : '';
  const m=new Map(); for (const g of data.spiele) if (g && isId(g.id)) m.set(g.id, norm(g.id, g));
  const t={}; for (const [y,v] of Object.entries(data.tierlisten||{})) if (/^\d{4}$/.test(y)) t[y]=normTier(v);
  S.games=m; S.tiers=t; S.loaded.games=true; S.loaded.tiers=true;
  renderAll();
}
async function start(){
  document.documentElement.lang='de';
  bind();
  const C=window.claude;
  if (!C || typeof C.use!=='function'){ startStatic(); return; }
  const use=n=>C.use(n).catch(()=>null);
  const [db, user, assets, downloads]=await Promise.all([use('db'), use('user'), use('assets'), use('downloads')]);
  S.assets=assets; S.downloads=downloads;
  if (!db){ startStatic(); return; }
  S.db=db;
  if (user){
    let cw=null, own=false;
    try { cw=await user.can('data.write'); } catch {}
    try { own=await user.isOwner(); } catch {}
    S.owner = cw===true || (cw===null && own);
  }
  db.collection('games').limit(1000).onSnapshot(snap=>{
    const m=new Map(); for (const d of snap.docs) if (d.exists) m.set(d.id, norm(d.id, d.data()));
    S.games=m; S.loaded.games=true; renderAll();
  }, err=>{ S.loadErr=err; S.loaded.games=true; renderAll(); });
  db.collection('tierlists').limit(500).onSnapshot(snap=>{
    const t={}; for (const d of snap.docs) if (d.exists) t[d.id]=normTier(d.data());
    S.tiers=t; S.loaded.tiers=true;
    if (drag && drag.active) S.tiersDirty=true; else renderAll();
  }, ()=>{ S.loaded.tiers=true; });
  renderAll();
}
start();
})();
