<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Speicherstand</title>
<style>
@font-face{font-family:'Bebas Neue';font-weight:400;font-display:swap;src:url(schriften/bebas-neue-400.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-weight:400;font-display:swap;src:url(schriften/instrument-sans-400.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-weight:500;font-display:swap;src:url(schriften/instrument-sans-500.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-weight:600;font-display:swap;src:url(schriften/instrument-sans-600.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-weight:700;font-display:swap;src:url(schriften/instrument-sans-700.woff2) format('woff2')}
</style>
<style>
/* Layout: Streaming-Oberfläche. Start mit großem Titelbild und waagerechten Reihen, Bibliothek als Raster, Tierliste mit Jahresauswahl; Spielseite als Info-Fenster mit Titelbild */
:root{
  --bg:#141414; --bg-2:#181818; --surface:#232323; --surface-2:#2F2F2F; --input:#333333;
  --line:rgba(255,255,255,.1); --line-2:rgba(255,255,255,.24);
  --ink:#FFFFFF; --ink-2:#D2D2D2; --muted:#A3A3A3; --faint:#777777;
  --red:#E50914; --red-dark:#B20710; --match:#46D369; --gold:#F5C518;
  --accent:var(--red); --accent-soft:rgba(229,9,20,.16);
  --ok:#46D369; --bad:#FF5A5F; --info:#5AA9FF; --idle:#A3A3A3;
  --t-s:#FF7F7F; --t-s2:#E8485A; --t-a:#FFBF7F; --t-a2:#F08A3C; --t-b:#FFDF7F; --t-b2:#F0BE3A; --t-c:#BFFF7F; --t-c2:#6CC75A; --t-d:#7FBFFF; --t-d2:#4B86E8; --t-ink:#161006;
  --shadow:0 14px 34px rgba(0,0,0,.6);
  --overlay:rgba(0,0,0,.72);
  --f-display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:var(--f-body);
  --gutter:clamp(16px,4vw,60px);
  --caret:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M0 0h10L5 6z' fill='white'/%3E%3C/svg%3E");
  --grain:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='160' height='160' filter='url(%23n)'/%3E%3C/svg%3E");
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
body.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.ico{display:inline-flex;line-height:0;flex:none}
.ico svg{display:block}
.muted{color:var(--muted)}
.small{font-size:13px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.3}}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:var(--red);animation:spin .8s linear infinite;flex:none}

/* Buttons & Felder */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 18px;border-radius:4px;border:0;background:rgba(109,109,110,.7);color:#fff;font-weight:700;font-size:15px;line-height:1.2;white-space:nowrap;text-decoration:none;transition:background .2s,transform .1s}
.btn:hover{background:rgba(109,109,110,.45)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn .ico svg{width:1.2em;height:1.2em}
.btn-white{background:#fff;color:#000}
.btn-white:hover{background:rgba(255,255,255,.78)}
.btn-grey{background:rgba(109,109,110,.7);color:#fff}
.btn-red,.btn-primary{background:var(--red);color:#fff}
.btn-red:hover,.btn-primary:hover{background:var(--red-dark)}
.btn-ghost{background:transparent}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn-danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px rgba(255,90,95,.5)}
.btn-danger:hover{background:rgba(255,90,95,.12)}
.btn.armed{background:var(--bad);color:#fff;box-shadow:none}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-lg{padding:11px 26px;font-size:18px}
.btn-round{width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(42,42,42,.6);color:#fff;display:grid;place-items:center;transition:border-color .2s,background .2s;flex:none}
.btn-round:hover{border-color:#fff;background:rgba(60,60,60,.8)}
.btn-round svg{width:18px;height:18px}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=url],select,textarea{width:100%;background:var(--input);border:1px solid transparent;border-radius:4px;padding:10px 13px;min-height:44px;color:#fff;transition:border-color .15s,background .15s}
input::placeholder,textarea::placeholder{color:#8C8C8C}
input:focus,select:focus,textarea:focus{outline:none;border-color:rgba(255,255,255,.7);background:#454545}
select option{background:#222;color:#fff}
textarea{resize:vertical;line-height:1.55}
input[type=range]{width:100%;accent-color:var(--red)}
.nf-select{width:auto;min-height:34px;padding:5px 32px 5px 12px;background:#000 var(--caret) no-repeat right 11px center;border:1px solid rgba(255,255,255,.85);border-radius:2px;font-size:14px;font-weight:600;appearance:none;-webkit-appearance:none;cursor:pointer}
.nf-select:focus{background:#000 var(--caret) no-repeat right 11px center;border-color:#fff}
.search{position:relative;flex:0 1 280px;width:280px;min-width:0}
.search .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#B3B3B3;pointer-events:none}
.search input{padding-left:36px;min-height:34px;background:#000;border:1px solid rgba(255,255,255,.45);border-radius:2px;font-size:14px}
.search input:focus{background:#000;border-color:#fff}

/* Kopfzeile */
.top{position:fixed;top:0;left:0;right:0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(180deg,rgba(0,0,0,.78) 10%,rgba(0,0,0,0));transition:background-color .4s}
.top.solid{background-color:var(--bg)}
.top-in{padding-inline:var(--gutter);display:flex;align-items:center;gap:30px;min-height:68px}
.brand{font-family:var(--f-display);font-size:32px;line-height:1;letter-spacing:.03em;color:var(--red);text-decoration:none;flex:none;padding-top:4px;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.tabs{display:flex;gap:20px}
.tab{appearance:none;border:0;background:none;padding:6px 0;font-size:14px;color:#E5E5E5;white-space:nowrap;transition:color .3s}
.tab:hover{color:#B3B3B3}
.tab[aria-current="page"]{color:#fff;font-weight:700}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:16px}
.savestate{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);opacity:0;transition:opacity .3s}
.savestate.is-saving,.savestate.is-saved{opacity:1}
.save-ico{width:12px;height:12px;border-radius:50%;border:2px solid #fff;border-top-color:transparent}
.is-saving .save-ico{animation:spin .8s linear infinite}
.is-saved .save-ico{border:0;width:8px;height:8px;background:var(--match)}
#btn-new{padding:7px 14px;font-size:14px;background:var(--red)}
#btn-new:hover{background:var(--red-dark)}
.show-sm{display:none}
@media (max-width:860px){
  .top-in{flex-wrap:wrap;gap:4px 16px;padding-block:8px 6px}
  .brand{font-size:28px}
  .tabs{order:3;width:100%;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:4px}
  .tab{padding:5px 13px;border:1px solid rgba(255,255,255,.55);border-radius:999px;font-size:13px}
  .tab[aria-current="page"]{background:rgba(255,255,255,.2);border-color:#fff}
  .hide-sm{display:none}
  .show-sm{display:inline}
  .save-txt{display:none}
}

.wrap{padding-inline:var(--gutter);padding-block:104px 90px}
body.view-start .wrap{padding-top:0}
body.view-start #banner{display:none}
@media (max-width:860px){.wrap{padding-top:124px}}
.gate-pad{padding-top:120px}
.foot{padding:0 var(--gutter) 40px;color:var(--faint);font-size:12.5px}
.pub-steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:13.5px;color:var(--ink-2)}
.pub-status{font-size:13px;color:var(--ink-2);min-height:1.4em}
.pub-btns{display:flex;flex-wrap:wrap;gap:8px}

/* Hinweise */
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:12px 16px;margin-bottom:26px;border-left:4px solid var(--red);border-radius:2px;background:var(--surface-2)}
.banner p{max-width:72ch;font-size:14px;color:var(--ink-2)}
.banner strong{color:#fff}
.notice,.loading{padding:40px 0;max-width:60ch}
.notice h2{font-size:26px;font-weight:700;margin-bottom:8px}
.loading{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.empty{display:flex;flex-wrap:wrap;align-items:center;gap:28px 40px;padding:36px;border-radius:6px;background:var(--bg-2)}
.slot{width:150px;aspect-ratio:3/4;max-width:100%;border:2px dashed var(--line-2);border-radius:6px;display:grid;place-items:center;align-content:center;gap:4px;color:var(--muted);flex:none}
.slot-plus{font-family:var(--f-display);font-size:56px;line-height:1}
.slot-lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding-inline:10px}
.empty-txt{flex:1 1 300px;min-width:0;display:grid;gap:12px;justify-items:start}
.empty-txt h2{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,4.4vw,52px);line-height:.95}
.empty-txt p{color:var(--muted);max-width:56ch}

/* Titelbild */
.bb{position:relative;isolation:isolate;margin-inline:calc(-1 * var(--gutter));min-height:clamp(480px,52vw,820px);display:flex;align-items:flex-end;padding:110px var(--gutter) clamp(130px,13vw,220px);overflow:hidden}
.bb-bg{position:absolute;inset:0;z-index:-2;background:var(--surface)}
.bb-bg>img,.bb-bg>.gen{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.bb-bg>img.from-cover{object-position:center 25%}
.bb::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(77deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.3) 48%,transparent 78%)}
.bb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;z-index:-1;background:linear-gradient(180deg,rgba(20,20,20,0),rgba(20,20,20,.65) 55%,var(--bg))}
.bb-in{max-width:min(660px,100%);display:grid;gap:16px;justify-items:start;transition:opacity .3s ease,transform .3s ease}
.bb-in.out{opacity:0;transform:translateY(10px)}
.bb-col{display:grid;gap:26px;justify-items:start;max-width:min(660px,100%);min-width:0}
.bb-layer{position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity .9s ease}
.bb-layer.on{opacity:1}
.bb-layer>img,.bb-layer>.gen{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.bb-layer>img.from-cover{object-position:center 25%}
.bb-layer.on>img,.bb-layer.on>.gen{animation:bbzoom calc(var(--bb-dur,8s) + 2s) ease-out both}
@keyframes bbzoom{from{transform:scale(1.07)}to{transform:scale(1)}}
.bb-dots{display:flex;flex-wrap:wrap;gap:6px}
.bb-dot{width:clamp(28px,3vw,42px);padding:9px 0;border:0;background:none;cursor:pointer}
.bb-dot i{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}
.bb-dot b{display:block;height:100%;background:#fff;transform:scaleX(0);transform-origin:left}
.bb-dot:hover i{background:rgba(255,255,255,.5)}
.bb-dot.done b{transform:scaleX(1);opacity:.55}
.bb-dot.on b{animation:bbfill var(--bb-dur,8s) linear forwards}
@keyframes bbfill{to{transform:scaleX(1)}}
.bb.paused .bb-dot.on b,body.locked .bb-dot.on b,body.tab-hidden .bb-dot.on b{animation-play-state:paused}
.bb-tag{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.36em;text-transform:uppercase;color:#E5E5E5;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.bb-mark{width:13px;height:18px;background:var(--red);clip-path:polygon(0 0,68% 0,100% 22%,100% 100%,0 100%);flex:none}
.bb-title{font-family:var(--f-display);font-weight:400;font-size:clamp(56px,8.4vw,132px);line-height:.86;letter-spacing:.012em;text-shadow:0 4px 30px rgba(0,0,0,.45);text-wrap:balance;overflow-wrap:break-word;max-width:100%}
.bb-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:15px;color:#E5E5E5;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.match{color:var(--match);font-weight:700}
.box{display:inline-flex;align-items:center;gap:5px;padding:0 7px;border:1px solid rgba(255,255,255,.45);border-radius:3px;font-size:12.5px;font-weight:600;line-height:1.7;text-shadow:none}
.box.gold{border-color:rgba(245,197,24,.65);color:var(--gold)}
.box .ico svg{width:12px;height:12px}
.bb-text{font-size:clamp(15px,1.35vw,19px);line-height:1.45;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:46ch}
.bb-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.bb-flag{position:absolute;right:0;bottom:clamp(150px,15vw,250px);padding:7px 64px 7px 12px;border-left:3px solid #DCDCDC;background:rgba(51,51,51,.6);font-size:14px;color:#fff}
@media (max-width:600px){.bb{min-height:600px;padding-bottom:110px}.bb-flag{display:none}.btn-lg{padding:10px 20px;font-size:16px}}

/* Reihen */
.rows-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(30px,3.4vw,48px);margin-top:clamp(-120px,-8vw,-70px);position:relative;z-index:2}
.row{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
.row-head{display:flex;align-items:baseline;gap:14px}
.row-title{font-size:clamp(17px,1.6vw,22px);font-weight:700;color:#E5E5E5}
.row-more{border:0;background:none;color:#54B9C5;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:4px;opacity:0;transform:translateX(-6px);transition:opacity .25s,transform .25s;padding:0}
.row-more .ico svg{width:14px;height:14px}
.row:hover .row-more,.row-more:focus-visible{opacity:1;transform:none}
@media (hover:none){.row-more{opacity:1;transform:none}}
.row-wrap{min-width:0;position:relative;margin-inline:calc(-1 * var(--gutter))}
.row-track{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-padding-inline:var(--gutter);padding:16px var(--gutter) 22px;margin-block:-16px -22px;scrollbar-width:none}
.row-track::-webkit-scrollbar{display:none}
.row-track>*{scroll-snap-align:start;flex:none}
.row-arrow{position:absolute;top:16px;bottom:22px;z-index:6;width:max(36px,calc(var(--gutter) - 6px));border:0;background:rgba(20,20,20,.55);color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .2s,background .2s}
.row-arrow.prev{left:0;border-radius:0 4px 4px 0}.row-arrow.next{right:0;border-radius:4px 0 0 4px}
.row-wrap:hover .row-arrow{opacity:1}
.row-arrow:hover{background:rgba(20,20,20,.82)}
.row-arrow svg{width:30px;height:30px;transition:transform .2s}
.row-arrow:hover svg{transform:scale(1.25)}
@media (hover:none){.row-arrow{display:none}}

/* Karten */
.nc{position:relative;padding:0;border:0;background:none;color:inherit;text-align:left;display:grid;gap:8px;align-content:start;transition:transform .3s cubic-bezier(.2,.8,.2,1);transform-origin:center}
.nc-art{position:relative;overflow:hidden;border-radius:5px;background:var(--surface);box-shadow:0 4px 12px rgba(0,0,0,.45);transition:box-shadow .3s}
.nc.poster{width:clamp(124px,13.2vw,196px)}
.nc.poster .nc-art{aspect-ratio:3/4}
.nc.wide{width:clamp(236px,23vw,330px)}
.nc.wide .nc-art{aspect-ratio:16/9}
.nc-art>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.nc-art>img.from-cover{object-position:center 25%}
.nc:hover,.nc:focus-visible{transform:scale(1.08);z-index:5}
.nc:hover .nc-art,.nc:focus-visible .nc-art{box-shadow:0 18px 40px rgba(0,0,0,.8)}
.nc:focus-visible{outline:none}
.nc:focus-visible .nc-art{outline:2px solid #fff;outline-offset:2px}
.nc-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.82))}
.nc-wtitle{position:absolute;left:12px;right:12px;bottom:9px;font-family:var(--f-display);font-size:clamp(23px,2vw,31px);line-height:.92;letter-spacing:.02em;text-shadow:0 2px 10px rgba(0,0,0,.6);overflow-wrap:break-word}
.nc-wtitle.small{font-size:19px}
.nc-info{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12.5px;color:var(--muted);padding-inline:2px;line-height:1.35}
.nc-info .nc-score{color:var(--match);font-weight:700}
.nc-hover{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:30px 10px 9px;display:grid;gap:1px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.92) 42%);opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s}
.nc-hover b{font-size:13.5px;font-weight:700;line-height:1.2}
.nc-hover span{font-size:12px;color:var(--ink-2)}
.nc-hover em{font-style:normal;color:var(--match);font-weight:700;margin-right:6px}
.nc:hover .nc-hover,.nc:focus-visible .nc-hover{opacity:1;transform:none}
.nc-flag{position:absolute;right:0;top:0;z-index:2;padding:3px 8px;border-radius:0 0 0 4px;background:var(--red);color:#fff;font-size:11px;font-weight:700;white-space:nowrap}
.nc-flag.gold{background:var(--gold);color:#141414}
.nc-flag.grey{background:#555}
.nc:hover .nc-flag{opacity:0}
.tier-badge{position:absolute;left:7px;top:7px;z-index:2;width:26px;height:26px;border-radius:4px;display:grid;place-items:center;background:linear-gradient(160deg,var(--t),var(--t2));color:var(--t-ink);font-family:var(--f-display);font-size:19px;line-height:1;padding-top:2px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.score-badge{display:none}
.nc.top10{display:flex;align-items:flex-end;width:auto;gap:0}
.rank{font-family:var(--f-display);font-size:clamp(150px,15.5vw,240px);line-height:.72;color:var(--bg);-webkit-text-stroke:4px #5E5E5E;letter-spacing:-.05em;margin-right:-.1em;position:relative;z-index:0;user-select:none;pointer-events:none}
.nc.top10 .nc-art{width:clamp(108px,10.8vw,160px);aspect-ratio:3/4;z-index:1;flex:none}
.nc.top10:hover{transform:scale(1.05)}

/* Hüllen */
.cover{position:absolute;inset:0;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;user-select:none}
.gen{position:absolute;inset:0;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;background:radial-gradient(90% 60% at 15% 5%,hsl(var(--h) 85% 58% / .95),transparent 62%),radial-gradient(85% 60% at 95% 95%,hsl(calc(var(--h) + 70) 80% 46% / .9),transparent 60%),linear-gradient(165deg,hsl(var(--h) 55% 22%),hsl(calc(var(--h) + 35) 60% 8%))}
.gen::after{content:"";position:absolute;inset:0;background-image:var(--grain);opacity:.2;mix-blend-mode:overlay;pointer-events:none}
.gen-title{position:relative;z-index:1;font-family:var(--f-display);font-weight:400;font-size:clamp(19px,1.7vw,27px);line-height:.92;letter-spacing:.02em;text-wrap:balance;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word;text-shadow:0 2px 14px rgba(0,0,0,.4)}

.gen-bg{background:radial-gradient(60% 70% at 25% 30%,hsl(var(--h) 85% 50%),transparent 70%),radial-gradient(60% 70% at 85% 80%,hsl(calc(var(--h) + 70) 80% 42%),transparent 70%),linear-gradient(160deg,hsl(var(--h) 50% 18%),hsl(calc(var(--h) + 35) 55% 7%))}
.bg-layer{position:absolute;inset:-50px;z-index:-2;background-size:cover;background-position:center;filter:blur(44px) saturate(1.3);opacity:.45}

/* Seitenköpfe & Bibliothek */
.page-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;margin-bottom:28px}
.page-title{font-size:clamp(28px,3.4vw,42px);font-weight:700;letter-spacing:-.01em;line-height:1.1}
.page-count{font-size:14px;color:var(--muted)}
.page-tools{margin-left:auto;display:flex;flex-wrap:nowrap;gap:8px;align-items:center}
@media (max-width:640px){.page-tools{margin-left:0;width:100%;flex-wrap:wrap}.search{flex:1 1 auto;width:auto}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:36px 10px}
.grid .nc.poster{width:auto}
@media (max-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px}}
.none{padding:40px 0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:3px;border:1px solid rgba(255,255,255,.35);color:var(--ink-2)}
.status{--c:var(--idle);color:var(--c);border-color:transparent;background:rgba(255,255,255,.06)}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-ok{--c:var(--ok)} .st-info{--c:var(--info)} .st-gold{--c:var(--gold)} .st-idle{--c:var(--idle)} .st-bad{--c:var(--bad)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c)}

/* Blätter */
.sheet{position:fixed;inset:0;z-index:50;background:var(--overlay);overflow-y:auto;overscroll-behavior:contain;display:flex;justify-content:center;align-items:flex-start;padding:max(32px,env(safe-area-inset-top,0px)) 16px max(32px,env(safe-area-inset-bottom,0px))}
.sheet-panel{width:min(920px,100%);background:var(--bg-2);border-radius:8px;overflow:clip;box-shadow:0 30px 90px rgba(0,0,0,.75);position:relative}
@media (max-width:720px){
  .sheet{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
  .sheet-panel{border-radius:0;min-height:100%;box-shadow:none}
}
.sheet-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px clamp(10px,2.5vw,24px);background:rgba(24,24,24,.94);border-bottom:1px solid var(--line)}
.sheet-bar .bar-title{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* Spielseite */
.d-close-wrap{position:sticky;top:0;height:0;z-index:8;display:flex;justify-content:flex-end}
.d-close{margin:14px;width:38px;height:38px;border-radius:50%;border:0;background:var(--bg-2);color:#fff;display:grid;place-items:center;box-shadow:0 2px 12px rgba(0,0,0,.6)}
.d-close:hover{background:#2a2a2a}
.d-hero{position:relative;isolation:isolate;aspect-ratio:16/9;max-height:520px;min-height:300px;display:flex;align-items:flex-end;padding:0 clamp(18px,4.5vw,48px) clamp(20px,3.4vw,40px)}
.d-bg{position:absolute;inset:0;z-index:-2;background:var(--surface)}
.d-bg>img,.d-bg>.gen{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.d-bg>img.from-cover{object-position:center 25%}
.d-hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,var(--bg-2) 0%,rgba(24,24,24,.45) 32%,rgba(24,24,24,0) 62%),linear-gradient(77deg,rgba(0,0,0,.6),rgba(0,0,0,0) 60%)}
.d-hero-in{display:grid;gap:18px;justify-items:start;max-width:100%}
.d-title{font-family:var(--f-display);font-weight:400;font-size:clamp(44px,6.4vw,82px);line-height:.88;letter-spacing:.012em;text-shadow:0 4px 24px rgba(0,0,0,.5);text-wrap:balance;overflow-wrap:break-word;max-width:100%}
.d-btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.d-body{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px 36px;align-items:start;padding:8px clamp(18px,4.5vw,48px) 32px}
@media (max-width:760px){.d-body{grid-template-columns:minmax(0,1fr)}.d-hero{aspect-ratio:4/3}}
.d-left,.d-right{display:grid;gap:16px;align-content:start;min-width:0}
.d-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:15px;color:#BCBCBC;font-weight:500}
.d-rankline{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}
.top-badge{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:28px;height:30px;background:var(--red);border-radius:2px;color:#fff;line-height:1;flex:none}
.top-badge small{font-size:7px;font-weight:800;letter-spacing:.08em}
.top-badge b{font-size:13px;font-weight:800}
.top-badge svg{width:16px;height:16px}
.d-verdict{font-size:18px;line-height:1.5;color:#fff;font-weight:500}
.notes{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px;line-height:1.66;color:var(--ink-2)}
.d-moment{display:grid;gap:4px;padding-left:14px;border-left:3px solid var(--red)}
.d-moment p{font-size:15.5px;line-height:1.55;color:#fff}
.d-line{font-size:14px;line-height:1.55;color:#DDDDDD;overflow-wrap:anywhere}
.d-line .k{color:var(--faint)}
.d-sec{padding:0 clamp(18px,4.5vw,48px) 38px;display:grid;gap:16px}
.d-h3{font-size:22px;font-weight:700}
.d-h3 span{color:var(--muted);font-weight:500;margin-left:8px;font-size:16px}
.shots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
@media (max-width:560px){.shots-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
.shot{margin:0;background:var(--surface-2);border-radius:5px;overflow:hidden;display:grid;align-content:start}
.shot-btn{display:block;width:100%;aspect-ratio:16/9;padding:0;border:0;overflow:hidden;background:var(--surface)}
.shot-btn img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.shot-btn:hover img{transform:scale(1.04)}
.shot figcaption{flex:1 1 auto;min-width:0;font-size:13.5px;color:var(--ink-2);overflow-wrap:anywhere}
.shot-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 10px;padding:9px 10px 10px 12px}
.shot-foot:empty{display:none}
.shot.hero{box-shadow:0 0 0 2px var(--gold)}
.shot-star{display:inline-flex;align-items:center;gap:6px;flex:none;margin-left:auto;padding:5px 11px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);font-size:12.5px;font-weight:600;transition:color .15s,border-color .15s,background .15s}
.shot-star:hover{color:#fff;border-color:#fff}
.shot-star.on{background:var(--gold);border-color:var(--gold);color:#141414}
.shot-star .ico svg{width:15px;height:15px}
.shot-hint{font-size:13px;color:var(--muted);margin-top:-6px}
.similar{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:12px}
.similar .nc.poster{width:auto}
.broken{width:100%;height:100%;display:grid;place-items:center;font-size:12px;color:var(--muted);background:var(--surface)}
.d-about{gap:8px}
.d-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;padding-top:16px;border-top:1px solid #404040;font-size:12.5px;color:var(--faint)}
.song{position:relative;isolation:isolate;overflow:hidden;display:grid;gap:12px;padding:14px;border-radius:6px;background:var(--surface-2)}
.song .bg-layer{opacity:.3}
.song-top{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center}
.song-art{position:relative;width:56px;height:56px;border-radius:4px;display:grid;place-items:center;color:#fff;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.song-art .ico svg{width:24px;height:24px;position:relative;z-index:1}
.song-txt{display:grid;gap:2px;min-width:0}
.song-name{font-weight:700;font-size:15.5px;line-height:1.25;overflow-wrap:anywhere}
.song-from{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq{display:flex;align-items:flex-end;gap:3px;height:14px}
.eq i{width:3px;border-radius:1px;background:var(--red);animation:eq 1.1s ease-in-out infinite;transform-origin:bottom}
.eq i:nth-child(1){height:40%;animation-delay:-.2s}.eq i:nth-child(2){height:90%;animation-delay:-.5s}.eq i:nth-child(3){height:60%;animation-delay:-.8s}.eq i:nth-child(4){height:75%;animation-delay:-.35s}
@keyframes eq{50%{transform:scaleY(.35)}}
.song-actions{display:flex;flex-wrap:wrap;gap:8px}
.song-empty{font-size:14px;color:var(--muted)}
.d-sub{font-size:13px;font-weight:700;color:var(--muted)}
.d-songsec{display:grid;gap:8px;margin-top:6px}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.96);color:#EDEFF3;display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lb-top{display:flex;align-items:center;gap:14px;padding:12px 16px}
.lb-count{font-size:13px;opacity:.75;font-variant-numeric:tabular-nums}
.lb-title{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-stage{position:relative;display:grid;place-items:center;min-height:0;padding:0 64px;touch-action:pan-y}
.lb-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;user-select:none;-webkit-user-drag:none}
.lb-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff}
.lb-btn:hover{background:rgba(255,255,255,.22)}
.lb-prev,.lb-next{position:absolute;top:50%;transform:translateY(-50%)}
.lb-prev{left:12px} .lb-next{right:12px}
.lb-cap{text-align:center;padding:12px 16px 18px;max-width:80ch;margin:0 auto;opacity:.85}
@media (max-width:640px){.lb-stage{padding:0 8px}.lb-prev,.lb-next{top:auto;bottom:-54px;transform:none}.lb-cap{padding-bottom:64px}}

/* Editor */
.ed{padding:24px clamp(16px,4vw,44px) 40px;display:grid;gap:30px}
.ed-sec{display:grid;gap:16px}
.ed-sec>h3{font-size:20px;font-weight:700}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.f{display:grid;gap:6px;min-width:0;align-content:start}
.f.full{grid-column:1 / -1}
.f-l{font-size:13px;font-weight:700;color:#E5E5E5}
.f-h{font-size:12.5px;color:var(--muted);font-weight:400}
.f-err{font-size:13px;color:#E87C03;font-weight:600}
@media (max-width:640px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.seg{display:flex;flex-wrap:wrap;gap:6px;border:0;padding:0;margin:0}
.seg legend{font-size:13px;font-weight:700;margin-bottom:6px;padding:0;color:#E5E5E5}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:7px 13px;border-radius:4px;background:var(--input);font-size:13.5px;font-weight:600;cursor:pointer}
.seg input:checked+label{background:#fff;color:#000}
.seg input:focus-visible+label{outline:2px solid #fff;outline-offset:2px}
.score-in{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:18px;padding:12px 18px;border-radius:4px;background:var(--input)}
.score-out{font-family:var(--f-display);font-weight:400;font-size:58px;line-height:1;min-width:2.4ch;text-align:center;color:var(--match);font-variant-numeric:tabular-nums}
.ed-media{display:grid;grid-template-columns:170px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:640px){.ed-media{grid-template-columns:minmax(0,1fr)}}
.ed-cover{display:grid;gap:10px;justify-items:start}
.ed-cover-prev{position:relative;width:150px;aspect-ratio:3/4;max-width:100%;border-radius:5px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.ed-cover-actions{display:flex;flex-wrap:wrap;gap:6px}
.busy{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;font-size:12px;color:var(--muted);background:var(--surface)}
.drop{display:flex;align-items:center;gap:14px;padding:18px;border:2px dashed #555;border-radius:6px;background:rgba(255,255,255,.02);color:var(--muted);cursor:pointer;font-size:14px;transition:border-color .15s,background .15s}
.drop strong{color:#fff}
.drop:hover,.drop.over{border-color:#fff;background:rgba(255,255,255,.05)}
.drop .ico svg{width:26px;height:26px}
.ed-shots{display:grid;gap:14px;min-width:0}
.ed-shots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
@media (max-width:420px){.ed-shots-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ed-shot{display:grid;gap:6px;min-width:0}
.ed-shot-img{position:relative;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:var(--surface)}
.ed-shot-img img{width:100%;height:100%;object-fit:cover;display:block}
.ed-shot .x,.ed-shot .mv{position:absolute;top:6px;width:28px;height:28px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(0,0,0,.75);color:#fff}
.ed-shot .x{right:6px} .ed-shot .mv{left:6px}
.ed-shot .st{position:absolute;right:6px;bottom:6px;width:30px;height:30px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(0,0,0,.75);color:#fff}
.ed-shot .st:hover{background:rgba(0,0,0,.9)}
.ed-shot .st.on{background:var(--gold);color:#141414}
.ed-shot .st svg{width:15px;height:15px}
.ed-shot.hero .ed-shot-img{box-shadow:0 0 0 2px var(--gold)}
.ed-shot .x svg,.ed-shot .mv svg{width:14px;height:14px}
.ed-shot .cap{min-height:34px;padding:6px 9px;font-size:13px}
.ed-danger{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:20px;border-top:1px solid #404040}

/* Tierliste */
.t-hint{font-size:14px;color:var(--muted);margin:-10px 0 18px}
.goty{position:relative;isolation:isolate;overflow:hidden;min-height:clamp(230px,24vw,320px);display:flex;align-items:flex-end;padding:clamp(18px,3vw,34px);margin-bottom:18px;border-radius:6px;background:var(--surface);transition:outline-color .15s}
.goty-bg{position:absolute;inset:0;z-index:-2}
.goty-bg>img,.goty-bg>.gen{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.goty-bg>img.from-cover{object-position:center 25%}
.goty::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(77deg,rgba(0,0,0,.85),rgba(0,0,0,.35) 55%,rgba(0,0,0,0)),linear-gradient(0deg,rgba(0,0,0,.5),rgba(0,0,0,0) 50%)}
.goty-empty{min-height:0;border:2px dashed #444;background:transparent}
.goty-empty::after{display:none}
.goty-txt{display:grid;gap:12px;justify-items:start;max-width:620px;min-width:0}
.goty-title{font-family:var(--f-display);font-size:clamp(38px,5vw,68px);line-height:.88;letter-spacing:.012em;text-wrap:balance}
.goty-empty .goty-title{font-size:clamp(28px,3.2vw,40px);color:var(--muted)}
.goty select{max-width:320px}
.goty.drop-over{outline:3px solid var(--red);outline-offset:-3px}
.board{display:grid;gap:6px}
.t-row{display:grid;grid-template-columns:86px minmax(0,1fr);min-height:124px;border-radius:4px;overflow:hidden;background:var(--bg-2);transition:background .15s}

.drop-over{background:#2a1214!important}
.tile{position:relative;width:76px;aspect-ratio:3/4;padding:0;border:0;border-radius:4px;overflow:hidden;background:var(--surface);box-shadow:0 4px 12px rgba(0,0,0,.5);flex:none;transition:transform .2s,box-shadow .2s}

.tile-score{position:absolute;right:3px;top:3px;z-index:3;font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:3px;background:rgba(0,0,0,.72);color:var(--match)}
.board.editing .tile,.pool.editing .tile{cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.tile.is-dragging{display:none}
.tile.ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;box-shadow:0 20px 40px rgba(0,0,0,.6);transition:none}
.tile-ph{width:76px;aspect-ratio:3/4;border:2px dashed var(--red);border-radius:4px;background:rgba(229,9,20,.12);flex:none}
.pool-wrap{margin-top:26px;display:grid;gap:10px}
.pool{border:2px dashed #3A3A3A;border-radius:6px;min-height:124px;transition:background .15s}

@media (max-width:560px){
  .t-row{grid-template-columns:56px minmax(0,1fr);min-height:100px}

}

/* Statistik */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi{padding:18px 20px;border-radius:6px;background:var(--bg-2);display:grid;gap:2px}
.kpi-v{font-family:var(--f-display);font-weight:400;font-size:52px;line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.kpi-v small{font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.kpi-s{font-size:12.5px;color:var(--muted)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:10px}
.panel{padding:20px 22px 22px;border-radius:6px;background:var(--bg-2);display:grid;gap:14px;align-content:start;min-width:0}
.panel.wide{grid-column:1 / -1}
.panel h3{font-size:16px;font-weight:700;color:#E5E5E5}
.chart-scroll{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
.chart-scroll svg{display:block}
.c-bar{fill:var(--red)}
.c-bar-past{fill:#5A5A5A}
.c-axis{stroke:#404040;stroke-width:1}
.c-lbl{fill:var(--muted);font-family:var(--f-body);font-size:12px}
.c-val{fill:#fff;font-family:var(--f-body);font-size:12.5px;font-weight:700}
.c-sub{fill:var(--faint);font-family:var(--f-body);font-size:11px}
.hbars{display:grid;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(0,130px) 1fr 40px;align-items:center;gap:10px;font-size:14px}
.hbar-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-t{height:6px;border-radius:999px;background:#333;overflow:hidden}
.hbar-f{display:block;height:100%;background:var(--red);border-radius:999px}
.hbar-v{font-size:13px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.rank-list{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rank-list button{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px;margin-inline:-8px;width:calc(100% + 16px);border:0;border-radius:4px;background:none;text-align:left}
.rank-list button:hover{background:#262626}
.rank-list .r-n{font-family:var(--f-display);font-size:26px;line-height:1;color:var(--bg);-webkit-text-stroke:1.5px #6A6A6A}
.rank-list .r-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rank-list .r-v{font-size:13px;font-weight:700;color:var(--match);font-variant-numeric:tabular-nums}
.memory{display:grid;gap:8px}
.memory p{font-size:15px}
.meter{height:6px;border-radius:999px;background:#333;overflow:hidden}
.meter span{display:block;height:100%;background:var(--red)}

/* Mini-Player */
.mp{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;width:min(380px,calc(100% - 32px));background:#181818;border-radius:8px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08)}
.mp-head{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px}
.mp-t{display:grid;min-width:0;flex:1;line-height:1.3}
.mp-t b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-t span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-x{width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:#fff;display:grid;place-items:center;flex:none}
.mp-x:hover{background:rgba(255,255,255,.12)}
.mp-x svg{width:16px;height:16px}
.mp-frame{position:relative;background:#000}
.mp-frame iframe{display:block;width:100%;border:0}
.mp-frame.yt{aspect-ratio:16/9}
.mp-frame.yt iframe{position:absolute;inset:0;height:100%}
.mp .eq{height:12px;flex:none}
.song-hint{font-size:12.5px;color:var(--muted)}
.d-left .d-songsec{margin-top:4px}
.d-left .song{grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px 18px;padding:12px 14px}
.d-left .song-actions{justify-content:flex-end}
.d-left .song-hint{grid-column:1 / -1;margin-top:-2px}
@media (max-width:560px){.d-left .song{grid-template-columns:minmax(0,1fr)}.d-left .song-actions{justify-content:flex-start}}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);z-index:120;max-width:min(520px,calc(100% - 32px));padding:11px 16px;border-radius:4px;background:#fff;color:#000;font-size:14px;font-weight:700;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>


<header class="top" id="top">
  <div class="top-in">
    <a class="brand" href="#start" id="brand">Speicherstand</a>
    <nav class="tabs" aria-label="Bereiche">
      <button class="tab" type="button" data-view="start" aria-current="page">Start</button>
      <button class="tab" type="button" data-view="lib">Bibliothek</button>
      <button class="tab" type="button" data-view="tiers">Tierlisten</button>
      <button class="tab" type="button" data-view="stats">Statistik</button>
    </nav>
    <div class="top-actions">
      <span class="savestate" id="savestate" aria-live="polite"><span class="save-ico" aria-hidden="true"></span><span class="save-txt"></span></span>
      <button class="btn" id="btn-new" type="button" hidden><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span class="hide-sm">Spiel eintragen</span><span class="show-sm">Eintragen</span></button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="banner"></div>
  <section id="view-start" aria-label="Start"><div class="gate-pad"><div class="loading"><span class="spin"></span>Lade Speicherstände …</div></div></section>
  <section id="view-lib" aria-label="Bibliothek" hidden>
    <div class="page-head" id="lib-pagehead" hidden>
      <h2 class="page-title">Bibliothek</h2>
      <select id="f-status" class="nf-select" aria-label="Nach Status filtern"></select>
      <span class="page-count" id="lib-count"></span>
      <div class="page-tools">
        <div class="search"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></span><input id="q" type="search" placeholder="Titel, Genre, Plattform" aria-label="Suchen" autocomplete="off"></div>
        <select id="f-sort" class="nf-select" aria-label="Sortierung">
          <option value="recent">Zuletzt gespielt</option>
          <option value="added">Zuletzt eingetragen</option>
          <option value="score">Beste Wertung</option>
          <option value="hours">Längste Spielzeit</option>
          <option value="title">Titel A–Z</option>
        </select>
      </div>
    </div>
    <div id="lib-body"><div class="loading"><span class="spin"></span>Lade Speicherstände …</div></div>
  </section>
  <section id="view-tiers" aria-label="Tierlisten" hidden></section>
  <section id="view-stats" aria-label="Statistik" hidden></section>
</main>
<footer class="foot" id="foot" hidden></footer>

<div class="sheet" id="detail" hidden><div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Spiel"></div></div>
<div class="sheet" id="editor" hidden><div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Eintrag bearbeiten"></div></div>
<div class="lb" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Screenshot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="mp" id="player" role="region" aria-label="Musik-Player" hidden></div>
<datalist id="dl-platforms"></datalist>

<script>
(() => {
'use strict';
const YEAR_NOW = new Date().getFullYear();
const TIERS = ['S','A','B','C','D'];
const STATUS = {
  spielt:      {label:'Spiele ich gerade', cls:'st-info'},
  durch:       {label:'Durchgespielt',     cls:'st-ok'},
  platin:      {label:'100 % / Platin',    cls:'st-gold'},
  pausiert:    {label:'Pausiert',          cls:'st-idle'},
  abgebrochen: {label:'Abgebrochen',       cls:'st-bad'},
};
const SUBS = [['story','Story'],['gameplay','Gameplay'],['atmo','Atmosphäre'],['grafik','Grafik'],['sound','Soundtrack']];
const PLATFORMS = ['PC','Steam Deck','PS5','PS4','Switch 2','Switch','Xbox Series X|S','Xbox One','iPhone / iPad','Android','Retro'];
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

const S = {
  db:null, assets:null, downloads:null, owner:false, noDb:false, loadErr:null, isStatic:false, assetMap:null, exportedAt:'',
  games:new Map(), tiers:{}, loaded:{games:false, tiers:false},
  view:'lib', bbId:null, q:'', fYear:'all', fStatus:'all', sort:'recent',
  tierYear:YEAR_NOW, tierEdit:false, tiersDirty:false, openId:null, usage:null,
};

/* ---------- Helfer ---------- */
const $ = (s, r=document) => r.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object'){ for (const [p,val] of Object.entries(v)) el.style.setProperty(p, String(val)); }
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, String(v));
  }
  for (const c of kids.flat(Infinity)){
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, text){ const el=document.createElementNS(SVGNS, tag); for (const [k,v] of Object.entries(attrs||{})) el.setAttribute(k, String(v)); if (text!=null) el.textContent = text; return el; }
const ICONS = {
  cam:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3.2l1.8-2.6h6l1.8 2.6H20v11H4z"/><circle cx="12" cy="13.2" r="3.4"/></svg>',
  crown:'<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M3 7.5l4.6 4.1L12 4.5l4.4 7.1L21 7.5 19.2 19H4.8z"/></svg>',
  close:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  back:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  left:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  edit:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  plus:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  img:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9.5" cy="9.5" r="1.6"/><path d="M20 15.5l-4.5-4.5L6 20"/></svg>',
  music:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>',
  play:'<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6.5 3.8v16.4L20.5 12z"/></svg>',
  star:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
  starOn:'<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
  info:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.6v.01"/></svg>',
  next:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  search:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
  down:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>',
};
function icon(n){ const s=document.createElement('span'); s.className='ico'; s.setAttribute('aria-hidden','true'); s.innerHTML=ICONS[n]; return s; }
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const sum = (a,f) => a.reduce((t,x)=>t+(f(x)||0),0);
function str(v,max){ return typeof v==='string' ? v.slice(0,max) : ''; }
function numOr(v){ const n = typeof v==='number' ? v : parseFloat(String(v??'').replace(',','.')); return Number.isFinite(n) ? n : null; }
function yearOf(d){ const m=/^(\d{4})-\d{2}-\d{2}$/.exec(d||''); return m ? +m[1] : null; }
function isId(v){ return typeof v==='string' && /^[A-Za-z0-9_-]{6,80}$/.test(v); }
function isDate(v){ return typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v); }
function clampScore(v){ const n=numOr(v); if (n==null || n<=0) return null; return Math.min(10, Math.round(n*2)/2); }
function clampYear(y){ y=parseInt(y,10); return (y>=1970 && y<=YEAR_NOW+1) ? y : null; }
function hue(s){ let x=0; for (const ch of String(s)) x=(x*31 + ch.charCodeAt(0))>>>0; return x%360; }
const blobUrl = id => (S.assetMap && S.assetMap[id]) ? S.assetMap[id] : '/_blob/' + encodeURIComponent(id);
const nf1 = new Intl.NumberFormat('de-DE',{maximumFractionDigits:1});
function fmtScore(s){ return s ? nf1.format(s) : '–'; }
function fmtHours(n){ return n ? nf1.format(n)+' h' : ''; }
function fmtDate(d){ if(!isDate(d)) return ''; const dt=new Date(d+'T12:00:00'); return isNaN(dt) ? '' : dt.toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric'}); }
function fmtStamp(ms){ return ms ? new Date(ms).toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'}) : ''; }
function fmtBytes(b){ return b>=1e9 ? nf1.format(b/1e9)+' GB' : nf1.format(b/1e6)+' MB'; }
function plural(n, one, many){ return `${n} ${n===1?one:many}`; }
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'), 3200); }

/* ---------- Daten ---------- */
function norm(id, d){
  d = d || {};
  const sc = (d.scores && typeof d.scores==='object') ? d.scores : {};
  const scores = {};
  for (const [k] of SUBS){ const v=clampScore(sc[k]); if (v) scores[k]=v; }
  const hours = numOr(d.hours);
  const shots = Array.isArray(d.shots) ? d.shots.filter(s=>s && isId(s.id)).slice(0,300).map(s=>({id:s.id, caption:str(s.caption,300)})) : [];
  return {
    id,
    title: str(d.title,200).trim() || 'Ohne Titel',
    year: clampYear(d.year),
    platform: str(d.platform,60).trim(),
    genres: Array.isArray(d.genres) ? d.genres.map(x=>str(x,40).trim()).filter(Boolean).slice(0,8) : [],
    status: STATUS[d.status] ? d.status : 'durch',
    score: clampScore(d.score), scores,
    start: isDate(d.start) ? d.start : '', end: isDate(d.end) ? d.end : '',
    hours: hours>0 ? Math.round(hours*10)/10 : null,
    verdict: str(d.verdict,600), notes: str(d.notes,60000), moment: str(d.moment,4000),
    song: str(d.song,200).trim(), songUrl: safeUrl(str(d.songUrl,500).trim()),
    cover: isId(d.cover) ? d.cover : null,
    shots,
    heroShot: (typeof d.heroShot==='string' && shots.some(x=>x.id===d.heroShot)) ? d.heroShot : null,
    example: d.example === true,
    created: numOr(d.created)||0, updated: numOr(d.updated)||0,
  };
}
function safeUrl(u){ if (!u) return ''; try { const x=new URL(u); return (x.protocol==='https:'||x.protocol==='http:') ? x.href : ''; } catch { return ''; } }
function songService(u){ let host=''; try { host=new URL(u).hostname.replace(/^www\./,''); } catch {} if (/(^|\.)spotify\.com$/.test(host)) return 'Spotify'; if (host==='music.youtube.com') return 'YouTube Music'; if (/(^|\.)youtube\.com$|^youtu\.be$/.test(host)) return 'YouTube'; if (host==='music.apple.com') return 'Apple Music'; if (/(^|\.)soundcloud\.com$/.test(host)) return 'SoundCloud'; return ''; }
function ytStart(u){ const t=u.searchParams.get('t')||u.searchParams.get('start'); if (!t) return 0; if (/^\d+$/.test(t)) return +t; const m=t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/); return m ? (+(m[1]||0))*3600+(+(m[2]||0))*60+(+(m[3]||0)) : 0; }
function songEmbed(url){
  let u; try { u=new URL(url); } catch { return null; }
  if (u.protocol!=='https:' && u.protocol!=='http:') return null;
  const host=u.hostname.toLowerCase().replace(/^www\./,'');
  if (host==='open.spotify.com'){
    const m=u.pathname.match(/^\/(?:intl-[a-z]{2}(?:-[a-z]{2})?\/)?(?:embed\/)?(track|album|playlist)\/([A-Za-z0-9]{10,40})\/?$/);
    return m ? {kind:'spotify', label:'Spotify', src:`https://open.spotify.com/embed/${m[1]}/${m[2]}?utm_source=generator&theme=0`, h:152} : null;
  }
  let yt=null;
  if (host==='youtu.be') yt=u.pathname.slice(1).split('/')[0];
  else if (host==='youtube.com' || host==='m.youtube.com' || host==='music.youtube.com'){
    yt=u.searchParams.get('v');
    if (!yt){ const m=u.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]{11})/); if (m) yt=m[1]; }
  }
  if (yt && /^[\w-]{11}$/.test(yt)){ const st=ytStart(u); return {kind:'youtube', label:'YouTube', src:`https://www.youtube-nocookie.com/embed/${yt}?autoplay=1&rel=0&playsinline=1${st ? '&start='+st : ''}`}; }
  if (host==='music.apple.com' && /^\/[a-z]{2}\/(album|song|playlist)\/\S+$/.test(u.pathname)) return {kind:'apple', label:'Apple Music', src:'https://embed.music.apple.com'+u.pathname+u.search, h:175};
  if (host==='soundcloud.com' && /^\/[\w-]+\/[\w-]+/.test(u.pathname)) return {kind:'soundcloud', label:'SoundCloud', src:'https://w.soundcloud.com/player/?url='+encodeURIComponent('https://soundcloud.com'+u.pathname)+'&auto_play=true&visual=false&show_comments=false&color=%23e50914', h:166};
  return null;
}
function normTier(d){ d=d||{}; const t={}; for (const T of TIERS) t[T] = Array.isArray(d[T]) ? d[T].filter(x=>typeof x==='string') : []; t.goty = typeof d.goty==='string' ? d.goty : null; return t; }
function cloneTier(t){ const n=normTier(t); for (const T of TIERS) n[T]=[...n[T]]; return n; }
function tierOf(g){ const t=S.tiers[g.year]; if(!t) return null; for (const T of TIERS) if (t[T].includes(g.id)) return T; return null; }
function isGoty(g){ return S.tiers[g.year]?.goty === g.id; }
function gamesOf(y){ return [...S.games.values()].filter(g=>g.year===y); }
function allYears(){ const s=new Set([YEAR_NOW]); for (const g of S.games.values()) if (g.year) s.add(g.year); return [...s].sort((a,b)=>b-a); }
function recentKey(g){ return (g.status==='spielt'?'1':'0') + (g.end||g.start||'0000-00-00') + String(Math.floor(g.updated)).padStart(15,'0'); }

/* Schreiben: eine Schreiboperation pro Dokument gleichzeitig, mit Speicher-Anzeige */
const chains = new Map();
let pend = 0, savedT;
function setSave(state){
  const el=$('#savestate'); const txt=$('.save-txt',el);
  if (state==='saving'){ el.className='savestate is-saving'; txt.textContent='Speichert …'; clearTimeout(savedT); }
  else if (state==='saved'){ el.className='savestate is-saved'; txt.textContent='Gespeichert'; clearTimeout(savedT); savedT=setTimeout(()=>{ if(!pend) el.className='savestate'; }, 2200); }
  else { el.className='savestate'; }
}
function dbErr(e){
  switch (e && e.code){
    case 'invalid_argument': return 'Speichern hat nicht geklappt. Nur du als Besitzer kannst Einträge ändern.';
    case 'quota_exceeded': return 'Der Speicher ist voll. Lösche alte Einträge, um Platz zu schaffen.';
    case 'resource_exhausted': return 'Zu viele Änderungen auf einmal. Warte kurz und versuch es nochmal.';
    case 'revoked': case 'not_granted': return 'Der Zugriff auf die Daten wurde beendet. Lade die Seite neu.';
    default: return 'Speichern hat nicht geklappt. Prüfe deine Verbindung und versuch es nochmal.';
  }
}
function writeDoc(path, fn){
  const run = async () => {
    pend++; setSave('saving'); let ok=false;
    try {
      try { await fn(); }
      catch (e){ if (e && e.code==='unavailable'){ await sleep(400+Math.random()*700); await fn(); } else throw e; }
      ok = true; return true;
    } catch (e){ toast(dbErr(e)); return false; }
    finally { pend--; if (!pend) setSave(ok ? 'saved' : 'idle'); }
  };
  const p = (chains.get(path) || Promise.resolve()).then(run, run);
  chains.set(path, p);
  return p;
}
function saveTier(year, t){
  S.tiers[year] = t;
  const path = 'tierlists/' + year;
  return writeDoc(path, () => S.db.doc(path).set({S:t.S, A:t.A, B:t.B, C:t.C, D:t.D, goty:t.goty || null}));
}
function removeFromTier(year, ids){
  const t=S.tiers[year]; if(!t) return;
  const n=cloneTier(t); let changed=false;
  for (const T of TIERS){ const before=n[T].length; n[T]=n[T].filter(x=>!ids.includes(x)); if (n[T].length!==before) changed=true; }
  if (n.goty && ids.includes(n.goty)){ n.goty=null; changed=true; }
  if (changed) saveTier(year, n);

/* Bilder verkleinern und hochladen */
function loadImg(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const i=new Image(); i.onload=()=>{ URL.revokeObjectURL(u); res(i); }; i.onerror=()=>{ URL.revokeObjectURL(u); rej({code:'unsupported_type'}); }; i.src=u; }); }
async function shrink(file, maxW, maxH, q){
  if (!/^image\/(png|jpeg|webp|gif|bmp|avif)$/.test(file.type||'')) throw {code:'unsupported_type'};
  if (file.type==='image/gif') return file;
  let src; try { src = await createImageBitmap(file); } catch { src = await loadImg(file); }
  const w=src.width, hh=src.height; const k=Math.min(1, maxW/w, maxH/hh);
  if (k===1 && file.size<2.5e6 && /^image\/(jpeg|webp)$/.test(file.type)) return file;
  const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(hh*k));
  const ctx=c.getContext('2d'); ctx.fillStyle='#111'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(src,0,0,c.width,c.height);
  const blob = await new Promise(r=>c.toBlob(r,'image/jpeg',q));
  return blob || file;
}
async function uploadImage(file, kind){
  const blob = kind==='cover' ? await shrink(file,720,1080,.88) : await shrink(file,2560,1600,.86);
  const type = /^image\/(png|jpeg|webp|gif)$/.test(blob.type) ? blob.type : 'image/jpeg';
  const res = await S.assets.upload(blob, {type});
  return res.id;
}
function upErr(e){
  switch (e && e.code){
    case 'too_large': return 'Das Bild ist zu groß (höchstens 20 MB).';
    case 'unsupported_type': return 'Dieses Format geht nicht. Nimm PNG, JPG, WebP oder GIF.';
    case 'quota_or_state': return 'Der Speicher für Bilder ist voll. Lösche alte Screenshots, um Platz zu schaffen.';
    case 'rate_limited': return 'Zu viele Uploads auf einmal. Warte kurz und versuch es nochmal.';
    case 'upstream_auth': return 'Anmeldung abgelaufen. Lade die Seite neu.';
    default: return 'Upload hat nicht geklappt. Versuch es nochmal.';
  }
}

function tileDown(e){
  if (!S.tierEdit || !S.owner || (e.pointerType==='mouse' && e.button!==0)) return;
  const el=e.currentTarget;
  drag={id:el.dataset.id, el, x0:e.clientX, y0:e.clientY, pid:e.pointerId, active:false, target:null, index:-1, zoneEl:null};
  window.addEventListener('pointermove', tileMove, {passive:false});
  window.addEventListener('pointerup', tileUp);
  window.addEventListener('pointercancel', tileCancel);
}
function tileMove(e){
  if (!drag || e.pointerId!==drag.pid) return;
  if (!drag.active){ if (Math.hypot(e.clientX-drag.x0, e.clientY-drag.y0)<6) return; beginDrag(e); }
  e.preventDefault();
  drag.ghost.style.transform=`translate(${e.clientX-drag.off.x}px,${e.clientY-drag.off.y}px) rotate(-3deg)`;
  if (e.clientY<70) window.scrollBy(0,-14); else if (e.clientY>innerHeight-70) window.scrollBy(0,14);
  locate(e.clientX, e.clientY);
}
function beginDrag(e){
  const el=drag.el, r=el.getBoundingClientRect();
  const ghost=el.cloneNode(true); ghost.classList.add('ghost'); ghost.style.width=r.width+'px'; ghost.style.height=r.height+'px';
  document.body.append(ghost);
  drag.ghost=ghost; drag.off={x:e.clientX-r.left, y:e.clientY-r.top};
  drag.ph=h('div',{class:'tile-ph','aria-hidden':'true'});
  el.classList.add('is-dragging'); document.body.classList.add('dragging');
  drag.active=true;
}
function locate(x,y){
  const zone=document.elementFromPoint(x,y)?.closest('[data-drop]') || null;
  if (drag.zoneEl && drag.zoneEl!==zone) drag.zoneEl.classList.remove('drop-over');
  drag.zoneEl=zone; drag.target=zone ? zone.dataset.drop : null;
  if (!zone || drag.target==='GOTY'){ drag.ph.remove(); if (zone) zone.classList.add('drop-over'); return; }
  zone.classList.add('drop-over');
  const box=$('.t-tiles',zone); if (!box) return;
  const tiles=[...box.querySelectorAll('.tile:not(.is-dragging)')];
  let idx=tiles.length;
  for (let i=0;i<tiles.length;i++){ const r=tiles[i].getBoundingClientRect(); if (y<r.top || (y<=r.bottom && x<r.left+r.width/2)){ idx=i; break; } }
  drag.index=idx;
  const empty=$('.t-empty',box); if (empty) empty.hidden=true;
  if (tiles[idx]) box.insertBefore(drag.ph, tiles[idx]); else box.append(drag.ph);
}
function tileUp(e){ if (drag && e.pointerId===drag.pid) endDrag(true); }
function tileCancel(e){ if (drag && e.pointerId===drag.pid) endDrag(false); }
function endDrag(commit){
  const d=drag; drag=null;
  window.removeEventListener('pointermove', tileMove); window.removeEventListener('pointerup', tileUp); window.removeEventListener('pointercancel', tileCancel);
  if (!d || !d.active) return;
  suppressUntil=Date.now()+400;
  d.ghost.remove(); d.ph.remove(); d.el.classList.remove('is-dragging'); d.zoneEl?.classList.remove('drop-over'); document.body.classList.remove('dragging');
  if (commit && d.target) applyMove(d.id, d.target, d.index);
  S.tiersDirty=false; renderTiers();
}
function applyMove(id, target, index){
  const y=S.tierYear; const n=cloneTier(S.tiers[y]||normTier({}));
  if (target==='GOTY'){ if (n.goty!==id){ n.goty=id; saveTier(y,n); } return; }
  const ids=new Set(gamesOf(y).map(g=>g.id)); const seen=new Set();
  for (const T of TIERS) n[T]=n[T].filter(x=>x!==id && ids.has(x) && !seen.has(x) && seen.add(x));
  if (TIERS.includes(target)) n[target].splice(Math.max(0,Math.min(index,n[target].length)),0,id);
  const before=JSON.stringify(cloneTier(S.tiers[y]||normTier({})));
  if (JSON.stringify(n)!==before) saveTier(y,n);
}

/* Screenshots abwechseln: 'next' nimmt jedes Mal einen anderen (alle der Reihe nach in zufälliger Folge),
   'stable' bleibt pro Seitenaufruf gleich, damit Reihen beim Neuzeichnen nicht flackern */
const shotQueue={}, shotLast={}, shotStable={};
function heroOf(g){ return g.heroShot ? (g.shots.find(x=>x.id===g.heroShot) || null) : null; }
function pickShot(g, mode){
  const n=g.shots.length; if (!n) return null;
  if (mode!=='detail'){ const hs=heroOf(g); if (hs) return hs; }
  if (n===1) return g.shots[0];
  if (mode==='stable'){
    if (!(shotStable[g.id]<n)) shotStable[g.id]=Math.floor(Math.random()*n);
    return g.shots[shotStable[g.id]];
  }
  let q=(shotQueue[g.id]||[]).filter(i=>i<n);
  if (!q.length){
    q=[...Array(n).keys()];
    for (let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [q[i],q[j]]=[q[j],q[i]]; }
    if (q[0]===shotLast[g.id]) q.push(q.shift());
  }
  const i=q.shift(); shotQueue[g.id]=q; shotLast[g.id]=i;
  return g.shots[i];
}
function landscapeArt(g, mode, eager){
  const s=pickShot(g, mode||'stable');
  if (s || g.cover){
    const im=h('img',{src:blobUrl(s ? s.id : g.cover), alt:'', class: s ? null : 'from-cover', loading: eager ? 'eager' : 'lazy', decoding:'async', draggable:'false'});
    im.addEventListener('error', ()=>im.replaceWith(genWide(g)), {once:true});
    return im;
  }
  return genWide(g);
}

function billboardList(all, recent){
  const out=[], seen=new Set();
  const add=(g,label)=>{ if (g && !seen.has(g.id) && out.length<6){ seen.add(g.id); out.push({g,label}); } };
  recent.filter(g=>g.status==='spielt').forEach(g=>add(g,'Gerade dabei'));
  Object.keys(S.tiers).sort((a,b)=>b-a).forEach(y=>{ const id=S.tiers[y].goty; const g=id && S.games.get(id); if (g && g.year===+y) add(g,`Spiel des Jahres ${y}`); });
  all.filter(g=>g.score).sort((a,b)=>b.score-a.score || a.title.localeCompare(b.title,'de')).slice(0,3).forEach(g=>add(g,'Top bewertet'));
  recent.forEach(g=>add(g, g.status==='spielt' ? 'Gerade dabei' : 'Zuletzt gespielt'));
  return out;
}

/* Titelbild-Runden: erst die normale Runde, dann Runden aus der Top 10 (gemischt, je höchstens 6 Spiele),
   danach wieder die normale Runde. So kommen auch Spiele dran, die sonst nie vorne stehen. */
function topRanked(){ return [...S.games.values()].filter(g=>g.score).sort((a,b)=>b.score-a.score || a.title.localeCompare(b.title,'de')).slice(0,10); }
function mainBillboard(){ const all=[...S.games.values()]; return billboardList(all, all.slice().sort((a,b)=>recentKey(b).localeCompare(recentKey(a)))); }
function topBatches(){
  const top=topRanked(); if (top.length<2) return [];
  const rank=new Map(top.map((g,i)=>[g.id, i+1]));
  const ids=top.map(g=>g.id);
  for (let i=ids.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; }
  const nb=Math.ceil(ids.length/6), size=Math.ceil(ids.length/nb), out=[];
  for (let k=0;k<ids.length;k+=size) out.push(ids.slice(k,k+size).map(id=>({g:S.games.get(id), label:`Platz ${rank.get(id)} deiner Top 10`, round:'top'})));
  return out;
}
function billboard(list){
  const bg=h('div',{class:'bb-bg','aria-hidden':'true'});
  const inner=h('div',{class:'bb-in', 'aria-live':'polite'});
  const flag=h('div',{class:'bb-flag'});
  const dots=h('div',{class:'bb-dots', role:'group', 'aria-label':'Titelbild wechseln'});
  const col=h('div',{class:'bb-col'}, inner, dots);
  const sec=h('section',{class:'bb'}, bg, col, flag);
  const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  let cur=-1, started=false, swapT=null, pre=null, queue=topBatches(), upcoming=null;
  const renderDots=()=>{
    dots.replaceChildren(...list.map((it,i)=>h('button',{class:'bb-dot', type:'button', title:it.g.title, 'aria-label':`${it.g.title} zeigen`, onclick:()=>show(i)}, h('i',null, h('b')))));
    dots.hidden = list.length<2;
  };
  const takeRound=()=>{
    if (!queue.length) queue=[mainBillboard(), ...topBatches()];
    let nl=queue.shift().filter(it=>it.g && S.games.has(it.g.id));
    if (!nl.length) nl=mainBillboard();
    const last=list.at(cur);
    if (nl.length>1 && last && nl.at(0).g.id===last.g.id) nl=nl.slice(1).concat(nl.slice(0,1));
    return nl;
  };
  const peekRound=()=>{ if (!upcoming) upcoming=takeRound(); return upcoming; };
  const nextItem=()=> cur+1<list.length ? list.at(cur+1) : peekRound().at(0);
  const artFor=it=>{ if (pre && pre.id===it.g.id){ const el=pre.el; pre=null; return el; } return landscapeArt(it.g,'next',true); };
  function show(i){
    i=(i+list.length)%list.length;
    const first=!started; started=true; cur=i;
    const it=list.at(i), {g,label}=it; S.bbId=g.id;
    const layer=h('div',{class:'bb-layer'}, artFor(it));
    bg.append(layer);
    if (first) layer.classList.add('on'); else requestAnimationFrame(()=>requestAnimationFrame(()=>layer.classList.add('on')));
    const old=[...bg.children].slice(0,-1);
    setTimeout(()=>old.forEach(x=>x.remove()), first ? 0 : 1000);
    const fill=()=>{ inner.replaceChildren(...bbContent(g,label)); flag.textContent=STATUS[g.status].label; };
    clearTimeout(swapT);
    if (first) fill(); else { inner.classList.add('out'); swapT=setTimeout(()=>{ fill(); inner.classList.remove('out'); }, 280); }
    [...dots.children].forEach((d,j)=>{ d.classList.remove('on'); d.classList.toggle('done', j<i); if (j===i) d.setAttribute('aria-current','true'); else d.removeAttribute('aria-current'); d.querySelector('i').replaceChildren(h('b')); });
    if (dots.children.length>i) dots.children[i].classList.add('on');
    if (list.length>1){ const nx=nextItem(); if (nx && nx.g.id!==g.id) pre={id:nx.g.id, el:landscapeArt(nx.g,'next',true)}; }
  }
  const advance=()=>{
    if (cur+1<list.length){ show(cur+1); return; }
    list=peekRound(); upcoming=null; renderDots(); show(0);
  };
  if (!reduce) dots.addEventListener('animationend', e=>{ if (e.animationName==='bbfill' && sec.isConnected) advance(); });
  const pause=on=>sec.classList.toggle('paused', on);
  col.addEventListener('mouseenter', ()=>pause(true)); col.addEventListener('mouseleave', ()=>pause(col.contains(document.activeElement)));
  col.addEventListener('focusin', ()=>pause(true)); col.addEventListener('focusout', ()=>setTimeout(()=>pause(col.matches(':hover') || col.contains(document.activeElement)), 0));
  let sx=null, sy=0;
  sec.addEventListener('pointerdown', e=>{ sx=e.clientX; sy=e.clientY; });
  sec.addEventListener('pointerup', e=>{ if (sx==null || list.length<2) return; const dx=e.clientX-sx, dy=e.clientY-sy; sx=null; if (Math.abs(dx)>60 && Math.abs(dy)<50){ if (dx<0) advance(); else show(cur-1); } });
  renderDots();
  show(Math.max(0, list.findIndex(it=>it.g.id===S.bbId)));
  return sec;
}

  const top=all.filter(g=>g.score).sort((a,b)=>b.score-a.score || a.title.localeCompare(b.title,'de')).slice(0,10);
